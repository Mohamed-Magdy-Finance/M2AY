    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // CR-M2AY-002: pre-paint language/direction bootstrap. Base derived from the
      // build (/M2AY/), never a magic string. Understands /M2AY/en, /M2AY/en/about,
      // and the SPA-fallback "?/en/about&..." query form. Single writer before React.
      (function () {
        var base = '/M2AY/'.replace(/\/$/, '');
        var p = window.location.pathname || '/';
        if (base && p.indexOf(base + '/') === 0) p = p.slice(base.length);
        else if (base && p === base) p = '/';
        var q = (window.location.search || '').replace(/&/g, '/');
        var isEnglish = /(?:^|\/)en(?:\/|$)/.test(p + q);
        document.documentElement.lang = isEnglish ? 'en' : 'ar';
        document.documentElement.dir = isEnglish ? 'ltr' : 'rtl';
      })();
    </script>
    <script type="module" crossorigin src="/M2AY/assets/index-DgvjA0jG.js"></script>
    <link rel="modulepreload" crossorigin href="/M2AY/assets/router-CqbapHZq.js">
    <link rel="modulepreload" crossorigin href="/M2AY/assets/ui-CDMlrOXe.js">
    <link rel="stylesheet" crossorigin href="/M2AY/assets/index-gJqASJWx.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // SPA Fallback: Restore path from query string
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </body>
